<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogIn</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="login.png" type="image/x-icon">
</head>

<body>
    <section>
        <div class="login-box">
            <form id="loginForm">
                <h2>Login</h2>
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" id="email" required>
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" id="password" minlength="8" maxlength="16" required>
                    <label>Password</label>
                </div>
                <div class="remember-forgot">
                    <label><input type="checkbox" id="remember">Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </section>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault(); // Stops page reload

            // Get values
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();
            let remember = document.getElementById("remember").checked;

            // Simple validation
            if (email === "" || password === "") {
                alert("Please fill in all fields");
                return;
            }

            // Optional: show what was entered (in real use, send to server)
            console.log("Email:", email);
            console.log("Password:", password);
            console.log("Remember Me:", remember);

            // Example success message
            alert("Login Successful!");

            // In real apps: send data to backend
            // fetch('/login', { method: 'POST', body: JSON.stringify({ email, password }) })
        });
    </script>
</body>

</html>
